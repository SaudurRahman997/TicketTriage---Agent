services:
  - type: web
    name: tickettriage-sentinel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MODEL_PROVIDER
        value: anthropic            # change to gemini if you deploy with Gemini
      - key: MODEL_NAME
        value: claude-haiku-4-5-20251001   # set to your chosen model after the comparison
      - key: ANTHROPIC_API_KEY
        sync: false                 # set the secret in the Render dashboard, never in git
      - key: GEMINI_API_KEY
        sync: false
